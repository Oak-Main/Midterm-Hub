name: Static export validation

# Build validation only. Vercel's Git integration publishes main; GitHub Pages
# is a retired duplicate target. Retain this workflow path and its weekly build
# without granting Pages/OIDC permissions or changing hosting settings.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly validation of the complete static export; this does not publish it.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: static-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Build current Next.js edition (midtermwatch.com)
        env:
          SITE_ORIGIN: https://midtermwatch.com
          SITE_CNAME: midtermwatch.com
        run: |
          python -m pip install -r requirements.txt
          npm ci
          npm run build
      - name: Validate exported routes and edition
        env:
          REQUIRE_STATIC_EXPORT: "1"
        run: npm test

      - name: Record build scope
        run: |
          echo 'Static export and regression checks passed. This workflow does not deploy.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Production release: Vercel Git integration. See the Vercel production verification workflow and DEPLOY.md.' >> "$GITHUB_STEP_SUMMARY"
