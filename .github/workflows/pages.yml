name: deploy-site

# Builds the current Next.js election edition and publishes the static export.
# Vercel is the public-domain host; this alternate Pages release uses the same
# dated research and preserved historical calendar inputs. See DEPLOY.md.

# Runs on the default branch and on manual dispatch only — not on feature branches,
# so an un-provisioned Pages site never shows as a failing check on a PR.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly rebuild so on-page relative countdowns stay fresh between commits.
    - cron: "0 6 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Build current Next.js edition (midtermwatch.com)
        env:
          SITE_ORIGIN: https://midtermwatch.com
          SITE_CNAME: midtermwatch.com
        run: |
          python -m pip install -r requirements.txt
          npm ci
          npm run build
          printf '%s\n' "$SITE_CNAME" > out/CNAME

      - uses: actions/configure-pages@v5
        with:
          # Enable Pages (Actions build type) on first run so no manual toggle is needed.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
